appId: app.notra.diary
name: 01 - launch, skip sign-in, first-launch setup
---
- launchApp:
    clearState: true
    stopApp: true
# First launch shows the picture cards (skippable with "छोड़ें"), then the optional sign-in, then setup.
- extendedWaitUntil:
    visible: "छोड़ें|.*बाद में|मेरा परिवार"
    timeout: 120000
- takeScreenshot: screenshots/01-first-launch
- runFlow: subflows/skip-onboarding.yaml
- extendedWaitUntil:
    visible: ".*बाद में|मेरा परिवार"
    timeout: 60000
- runFlow: subflows/skip-signin.yaml
- extendedWaitUntil:
    visible: "मेरा परिवार"
    timeout: 60000
- takeScreenshot: screenshots/01-setup-empty
- runFlow:
    file: subflows/type-field.yaml
    env: { LABEL: "नाम", VALUE: "Ramesh" }
- runFlow:
    file: subflows/type-field.yaml
    env: { LABEL: "पिता का नाम", VALUE: "Gopal" }
- runFlow:
    file: subflows/type-field.yaml
    env: { LABEL: "गाँव", VALUE: "Udaipur" }
- scrollUntilVisible:
    element: "₹101"
    timeout: 20000
- tapOn: "₹101"
- takeScreenshot: screenshots/01-setup-filled
- scrollUntilVisible:
    element: ".*शुरू करें"
    timeout: 20000
- tapOn: ".*शुरू करें"
# Home: greeting, the summary strip (कुल मिला / कुल दिया) and the four tiles.
- extendedWaitUntil:
    visible: "नोतरा लिखें"
    timeout: 30000
- assertVisible: ".*कुल मिला.*"
- assertVisible: ".*कुल दिया.*"
- assertVisible: "कार्यक्रम"
- assertVisible: "परिवार"
- assertVisible: "हिसाब"
- takeScreenshot: screenshots/01-home-after-setup
