# Cold-start the app WITHOUT clearing data and land on the Home tab.
# Home is recognised by its "परिवार" button (id btn-families) and its "कुल मिला" summary.
appId: app.notra.book
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: ".*बाद में|कुल मिला"
    timeout: 90000
- runFlow: skip-signin.yaml
- extendedWaitUntil:
    visible:
      id: btn-families
    timeout: 60000
