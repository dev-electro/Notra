# Fill one labelled text box. Env: LABEL (Hindi label), VALUE (ASCII text).
# Field.tsx renders the label as <Text> AND sets it as the TextInput's accessibilityLabel,
# so two nodes match the label; the input is the second one (index 1).
appId: app.notra.diary
---
- scrollUntilVisible:
    element: ${LABEL}
    timeout: 20000
- tapOn:
    text: ${LABEL}
    index: 1
- inputText: ${VALUE}
- hideKeyboard
