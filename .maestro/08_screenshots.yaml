appId: app.notra.diary
name: 08 - screenshots of every main screen (for review, not assertions)
---
# Runs after flows 01-07, so the family "Mohan", an entry and a wedding with two givers exist.
# Output: screenshots/<name>.png  (home, entry, number-pad, families, family-detail, events, event-ledger, hisaab, settings, onboarding)
- runFlow: subflows/launch-home.yaml
- takeScreenshot: screenshots/home

# Write an entry: family picker, then the amount screen with the number pad.
- tapOn: "नोतरा लिखें"
- extendedWaitUntil:
    visible: "किसका नोतरा?"
    timeout: 20000
- takeScreenshot: screenshots/entry
- tapOn:
    text: "खोजें.*"
    index: 1
- inputText: "Kherwa"
- hideKeyboard
- extendedWaitUntil:
    visible: "Mohan"
    timeout: 20000
- tapOn: "Mohan"
- extendedWaitUntil:
    visible: "नोतरा लिखें"
    timeout: 20000
- tapOn: "5"
- tapOn: "0"
- tapOn: "1"
- scroll
- takeScreenshot: screenshots/number-pad
- tapOn: "वापस"
- extendedWaitUntil:
    visible: "नोतरा लिखें"
    timeout: 20000

# Families and one family's page.
- tapOn: "परिवार"
- extendedWaitUntil:
    visible: "Mohan"
    timeout: 20000
- takeScreenshot: screenshots/families
- tapOn: "Mohan"
- extendedWaitUntil:
    visible: "पूरा हिसाब"
    timeout: 20000
- takeScreenshot: screenshots/family-detail
- tapOn: "वापस"
- tapOn: "वापस"
- extendedWaitUntil:
    visible: "नोतरा लिखें"
    timeout: 20000

# Events and the wedding's ledger.
- tapOn: "कार्यक्रम"
- extendedWaitUntil:
    visible: "नया कार्यक्रम"
    timeout: 20000
- takeScreenshot: screenshots/events
- tapOn: "खाता खोलें"
- extendedWaitUntil:
    visible: "2 परिवार"
    timeout: 20000
- takeScreenshot: screenshots/event-ledger
- tapOn: "वापस"
- tapOn: "वापस"
- extendedWaitUntil:
    visible: "नोतरा लिखें"
    timeout: 20000

# Hisaab (reports).
- tapOn: "हिसाब"
- extendedWaitUntil:
    visible: "किसका कितना"
    timeout: 20000
- takeScreenshot: screenshots/hisaab
- tapOn: "वापस"
- extendedWaitUntil:
    visible: "नोतरा लिखें"
    timeout: 20000

# Settings (the gear, top right).
- tapOn: "सेटिंग"
- extendedWaitUntil:
    visible: "इंटरनेट बैकअप"
    timeout: 20000
- takeScreenshot: screenshots/settings

# Onboarding appears only on a fresh install, so this goes last: it wipes the app's data.
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: "छोड़ें"
    timeout: 120000
- takeScreenshot: screenshots/onboarding
