appId: app.notra.diary
name: 03 - AAYA entry of 501 via number pad, read-back confirmed
---
- runFlow: subflows/launch-home.yaml
- tapOn: "नोतरा लिखें"
- extendedWaitUntil:
    visible: "किसका नोतरा?"
    timeout: 20000
# Search by village (unique to Mohan) so the search box text can't be confused with the row text.
- tapOn:
    text: "खोजें.*"
    index: 1
- inputText: "Kherwa"
- hideKeyboard
- extendedWaitUntil:
    visible: "Mohan"
    timeout: 20000
- tapOn: "Mohan"
- extendedWaitUntil:
    visible: "नोतरा लिखें"
    timeout: 20000
- takeScreenshot: screenshots/03-entry-form
# Direction defaults to मिला (आया). Type 501 on the number pad.
- tapOn: "5"
- tapOn: "0"
- tapOn: "1"
- assertVisible: ".*₹501.*"
- takeScreenshot: screenshots/03-amount-501
- scrollUntilVisible:
    element: ".*सेव करें"
    timeout: 20000
- tapOn: ".*सेव करें"
- extendedWaitUntil:
    visible: "सही है?"
    timeout: 20000
- assertVisible: ".*501.*"
- takeScreenshot: screenshots/03-readback
- tapOn: "हाँ.*"
- extendedWaitUntil:
    visible: "नोतरा लिखें"
    timeout: 20000
- takeScreenshot: screenshots/03-after-confirm
