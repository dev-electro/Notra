appId: app.notra.book
name: 02 - add a household (with a phone number)
---
- runFlow: subflows/launch-home.yaml
- tapOn:
    id: btn-families
- extendedWaitUntil:
    visible:
      id: btn-new-household
    timeout: 20000
- tapOn:
    id: btn-new-household
- extendedWaitUntil:
    visible: "नया परिवार"
    timeout: 20000
- runFlow:
    file: subflows/type-id.yaml
    env: { ID: "field-name", VALUE: "Mohan" }
- runFlow:
    file: subflows/type-id.yaml
    env: { ID: "field-father", VALUE: "Sohan" }
- runFlow:
    file: subflows/type-id.yaml
    env: { ID: "field-village", VALUE: "Kherwa" }
- runFlow:
    file: subflows/type-id.yaml
    env: { ID: "field-panchayat", VALUE: "Upla" }
- runFlow:
    file: subflows/type-id.yaml
    env: { ID: "field-phone", VALUE: "9876543210" }
# The contact button opens the phone's own picker for ONE contact (no contacts permission); it is only photographed here.
- scrollUntilVisible:
    element:
      id: btn-pick-contact
    timeout: 20000
    optional: true
- takeScreenshot: screenshots/02-household-form
- tapOn:
    id: btn-save
# Back on the household directory: the new family is listed with father + village.
- extendedWaitUntil:
    visible: "Mohan"
    timeout: 20000
- assertVisible: "Mohan"
- assertVisible: ".*Sohan.*Kherwa.*"
- takeScreenshot: screenshots/02-household-listed
