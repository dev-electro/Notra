# Flows share app state (flow 01 does first-launch setup, later flows build on its data),
# so they must run in this exact order. Without this Maestro runs them in arbitrary order.
# Keep these names identical to the `name:` line of each flow file.
flows:
  - "*"
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - "01 - launch, skip sign-in, first-launch setup"
    - "02 - add a household (with a phone number)"
    - "03 - one search box finds a family by name, father, village, panchayat and phone"
    - "04 - मेरा नोतरा, make my event, record who came (receive only), summary total"
    - "05 - दूसरों का नोतरा, go to another family's program, give, उतार and चढ़ाव in the read-back"
    - "06 - पुराना हिसाब जोड़ें, past dates for my old Notra and another family's"
    - "07 - हिसाब tab, open each report, send a report as photos"
    - "08 - kill and relaunch, data persisted"
    - "09 - screenshots of every main screen (for review, not assertions)"
