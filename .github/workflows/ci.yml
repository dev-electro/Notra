name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Reuse compiled C/C++ (React Native, SQLCipher, reanimated) between builds
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  android-apk:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ github.job }}
          max-size: 2G
      - run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - name: Build release APK (debug-signed, for testing only)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --build-cache --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: notra-diary-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Report APK size
        run: ls -lh android/app/build/outputs/apk/release/*.apk
