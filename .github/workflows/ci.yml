name: CI

on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**/*.md', 'admin/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'admin/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Reuse compiled C/C++ (React Native, SQLCipher, reanimated) between builds
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  # Android's CMake builds use per-build absolute paths; make ccache match across runs
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: 'true'
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime,file_macro,system_headers

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  android-apk:
    needs: checks
    # One APK build per commit: the push run builds (and publishes) it, so skip the duplicate PR run for same-repo branches.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # publish the test APK as a pre-release for easy phone download
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ github.job }}
          max-size: 2G
      - run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
          NOTRA_FAST_TEST: '1' # skip release lint in the test APK (plugins/withFastTestBuild.js)
          NOTRA_ADS_TEST: '1' # test builds never carry real AdMob ids (docs/ADS.md)
      - name: Build release APK (debug-signed, for testing only)
        working-directory: android
        # Test APK only: arm64 alone (about half the native compile) and no R8/resource shrinking (several minutes).
        # The Play release (release.yml) still builds both ABIs with R8.
        run: >-
          ./gradlew assembleRelease --no-daemon --build-cache --parallel
          -PreactNativeArchitectures=arm64-v8a
          -Pandroid.enableProguardInReleaseBuilds=false
          -Pandroid.enableShrinkResourcesInReleaseBuilds=false
      - uses: actions/upload-artifact@v4
        with:
          name: notra-book-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Report APK size
        run: ls -lh android/app/build/outputs/apk/release/*.apk
      - name: Publish test APK as a pre-release (direct phone download)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${GITHUB_REF_NAME//\//-}"
          TAG="test-$BRANCH"
          cp "$(ls android/app/build/outputs/apk/release/*.apk | head -n1)" notra-book-test.apk
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" notra-book-test.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Notra Book test build ($BRANCH, ${GITHUB_SHA::7})" \
            --notes "Test build for sideloading, not for the Play Store. Download notra-book-test.apk on your Android phone and install it (allow 'install unknown apps')."
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/notra-book-test.apk"
