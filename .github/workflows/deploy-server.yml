name: Deploy server

# Manual only. Applies database migrations to DATABASE_URL, then deploys the Cloudflare Worker.
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DATABASE_URL, CLOUDFLARE_API_TOKEN, JWT_SECRET, OTP_PEPPER, GOOGLE_CLIENT_IDS
# Required for SMS in production: MSG91_AUTH_KEY, MSG91_TEMPLATE_ID. Optional: SMS_PROVIDER (defaults to msg91; "dev" only for testing).
# Also set CLOUDFLARE_ACCOUNT_ID if your token can access more than one account.
on:
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Apply migrations
        run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set Worker secrets
        run: |
          set -eu
          for name in DATABASE_URL JWT_SECRET OTP_PEPPER GOOGLE_CLIENT_IDS SMS_PROVIDER MSG91_AUTH_KEY MSG91_TEMPLATE_ID; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --yes wrangler@4 secret put "$name" > /dev/null
              echo "set $name"
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OTP_PEPPER: ${{ secrets.OTP_PEPPER }}
          GOOGLE_CLIENT_IDS: ${{ secrets.GOOGLE_CLIENT_IDS }}
          SMS_PROVIDER: ${{ secrets.SMS_PROVIDER }}
          MSG91_AUTH_KEY: ${{ secrets.MSG91_AUTH_KEY }}
          MSG91_TEMPLATE_ID: ${{ secrets.MSG91_TEMPLATE_ID }}
