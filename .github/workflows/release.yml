name: Release

# Signed Play Store release. Cut one with:  git tag v1.0.0 && git push --tags
# See docs/RELEASE.md for the keystore / Play Console / secrets setup.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # versionCode: monotonically increasing. withReleaseSigning.js applies it to build.gradle at
      # prebuild time (go higher than any versionCode already on Play by editing this expression,
      # e.g. ${{ github.run_number + 100 }}).
      NOTRA_VERSION_CODE: ${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Quality gates
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Decode upload keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "NOTRA_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Warn when unsigned
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 is empty - building DEBUG-signed artifacts (not uploadable to Play)."

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
          NOTRA_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NOTRA_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NOTRA_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build signed AAB + APKs (armeabi-v7a, arm64-v8a)
        working-directory: android
        env:
          NOTRA_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NOTRA_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NOTRA_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Verify signature
        run: |
          ls -lh android/app/build/outputs/apk/release/*.apk android/app/build/outputs/bundle/release/*.aab
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/*.apk | head -n 5

      - uses: actions/upload-artifact@v4
        with:
          name: notra-diary-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: notra-diary-apks
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true

      - name: Upload AAB to Google Play (internal track, draft)
        if: env.HAS_PLAY == 'true' && env.HAS_KEYSTORE == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.notra.diary
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: draft
