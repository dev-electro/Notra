name: Admin panel

# Push (admin/** only): typecheck, lint, test, build.
# Manual (workflow_dispatch): the same checks, then deploy admin/dist to Cloudflare Pages (project "notra-admin").
# Repository secrets for the deploy: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Optional repository variables baked into the build: ADMIN_API_BASE (the Worker origin), ADMIN_GOOGLE_CLIENT_ID.
on:
  push:
    paths:
      - 'admin/**'
      - '.github/workflows/admin.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Cloudflare Pages after the checks pass'
        type: boolean
        default: true

concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE: ${{ vars.ADMIN_API_BASE }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.ADMIN_GOOGLE_CLIENT_ID }}
      - name: Report bundle size
        run: du -sh dist && ls -lh dist/assets | sort -k5 -h | tail -5
      - uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist
          retention-days: 7

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: admin/dist
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy admin/dist --project-name notra-admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
